<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
  </defs>
  <text x="240" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">3안 · Hierarchical + Standby Orchestrator</text>

  <!-- VIP -->
  <rect x="200" y="36" width="80" height="22" rx="11" fill="#0ea5e9"/>
  <text x="240" y="51" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">VIP</text>
  <line x1="240" y1="58" x2="155" y2="78" stroke="#475569" stroke-width="1.6" marker-end="url(#arr3)"/>

  <!-- Active orchestrator -->
  <rect x="60" y="80" width="150" height="46" rx="9" fill="#1e293b"/>
  <text x="135" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Orchestrator</text>
  <text x="135" y="116" text-anchor="middle" font-size="10" fill="#86efac">● Active</text>

  <!-- Passive orchestrator -->
  <rect x="270" y="80" width="150" height="46" rx="9" fill="#475569" opacity="0.85"/>
  <text x="345" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Orchestrator</text>
  <text x="345" y="116" text-anchor="middle" font-size="10" fill="#fcd34d">○ Passive (Standby)</text>

  <!-- heartbeat -->
  <line x1="210" y1="103" x2="270" y2="103" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="240" y="98" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">heartbeat</text>

  <!-- shared state store -->
  <path d="M175 150 a65 9 0 0 1 130 0 v26 a65 9 0 0 1 -130 0 z" fill="#e2e8f0" stroke="#94a3b8"/>
  <ellipse cx="240" cy="150" rx="65" ry="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="240" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Shared State Store</text>
  <line x1="135" y1="126" x2="205" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#arr3)"/>
  <line x1="345" y1="126" x2="290" y2="148" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arr3)"/>
  <text x="120" y="146" font-size="8" fill="#64748b">write</text>
  <text x="300" y="146" font-size="8" fill="#64748b">resync</text>

  <!-- workers -->
  <g font-size="10.5" font-weight="600" fill="#0f172a">
    <rect x="24"  y="210" width="92" height="40" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><text x="70"  y="234" text-anchor="middle">IR Converter</text>
    <rect x="140" y="210" width="92" height="40" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><text x="186" y="234" text-anchor="middle">Graph Opt.</text>
    <rect x="256" y="210" width="92" height="40" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><text x="302" y="234" text-anchor="middle">Quantizer</text>
    <rect x="372" y="210" width="84" height="40" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><text x="414" y="234" text-anchor="middle">Compiler</text>
  </g>
  <g stroke="#475569" stroke-width="1.4" marker-end="url(#arr3)" fill="none" opacity="0.7">
    <line x1="110" y1="126" x2="80" y2="208"/><line x1="130" y1="126" x2="190" y2="208"/>
    <line x1="140" y1="126" x2="300" y2="208"/><line x1="150" y1="126" x2="410" y2="208"/>
  </g>

  <text x="240" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">▲ SPOF 완화 (페일오버) · 제어성 ★★★ 유지</text>
</svg>
