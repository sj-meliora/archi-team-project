<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
  </defs>
  <text x="240" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">1안 · 중앙 오케스트레이터 (Hierarchical)</text>

  <!-- orchestrator -->
  <rect x="140" y="40" width="200" height="50" rx="9" fill="#1e293b"/>
  <text x="240" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Orchestrator Agent</text>
  <text x="240" y="79" text-anchor="middle" font-size="10" fill="#cbd5e1">동적 감독 · 재계획 · 정책</text>
  <rect x="346" y="44" width="62" height="20" rx="10" fill="#f59e0b"/>
  <text x="377" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">HITL gate</text>

  <!-- workers -->
  <g font-size="11" font-weight="600" fill="#0f172a">
    <rect x="24"  y="206" width="92" height="46" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><text x="70"  y="234" text-anchor="middle">IR Converter</text>
    <rect x="140" y="206" width="92" height="46" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><text x="186" y="234" text-anchor="middle">Graph Opt.</text>
    <rect x="256" y="206" width="92" height="46" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><text x="302" y="234" text-anchor="middle">Quantizer</text>
    <rect x="372" y="206" width="84" height="46" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><text x="414" y="234" text-anchor="middle">Compiler</text>
  </g>

  <!-- delegate arrows (down) -->
  <g stroke="#475569" stroke-width="1.6" marker-end="url(#arr)" fill="none">
    <line x1="200" y1="92" x2="80"  y2="204"/>
    <line x1="222" y1="92" x2="190" y2="204"/>
    <line x1="258" y1="92" x2="300" y2="204"/>
    <line x1="280" y1="92" x2="410" y2="204"/>
  </g>
  <!-- pipeline order (faint) -->
  <g stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arrL)" fill="none">
    <line x1="116" y1="229" x2="140" y2="229"/>
    <line x1="232" y1="229" x2="256" y2="229"/>
    <line x1="348" y1="229" x2="372" y2="229"/>
  </g>

  <text x="240" y="118" text-anchor="middle" font-size="10" fill="#64748b">위임 ↓ · 결과 ↑ · 모든 제어가 한 점</text>
  <!-- SPOF marker -->
  <text x="240" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">▲ 단일 장애점(SPOF)</text>
</svg>
