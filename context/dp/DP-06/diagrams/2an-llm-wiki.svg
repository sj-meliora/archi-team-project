<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="warrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6E74"/></marker>
    <marker id="warrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2FA98C"/></marker>
    <marker id="warrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6FD0"/></marker>
  </defs>
  <rect width="880" height="480" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="18" font-weight="700" fill="#2FA98C">2안 · LLM 위키 — Agent가 배운 것을 문서로 축적하고, 판단 시 조회</text>

  <!-- Agent -->
  <rect x="24" y="100" width="180" height="120" rx="8" fill="#F1F5F5" stroke="#5B6E74" stroke-width="1.5"/>
  <text x="114" y="128" font-size="16" font-weight="700" fill="#1B2A30" text-anchor="middle">노드 Agent</text>
  <text x="114" y="150" font-size="12" fill="#5B6E74" text-anchor="middle">불량 분석 · 회귀 판단</text>
  <text x="114" y="174" font-size="12" font-style="italic" fill="#5B6E74" text-anchor="middle">“모델 A quantize 실패,</text>
  <text x="114" y="192" font-size="12" font-style="italic" fill="#5B6E74" text-anchor="middle">유사 사례는?”</text>
  <text x="24" y="246" font-size="12" fill="#1B2A30">문서 근거로 분석 · 해결</text>

  <!-- wiki stacked cards -->
  <rect x="332" y="112" width="224" height="150" rx="6" fill="#FFFFFF" stroke="#C9D4D7"/>
  <rect x="324" y="104" width="224" height="150" rx="6" fill="#FFFFFF" stroke="#C9D4D7"/>
  <rect x="316" y="96" width="224" height="150" rx="6" fill="#E9F6F1" stroke="#2FA98C" stroke-width="1.5"/>
  <text x="428" y="122" font-size="15" font-weight="700" fill="#1B2A30" text-anchor="middle">LLM 위키 (문서 티어)</text>
  <text x="332" y="148" font-size="11.5" fill="#1B2A30">· 모델별 특이사항</text>
  <text x="332" y="168" font-size="11.5" fill="#1B2A30">· 이슈 postmortem (원인 → 해결)</text>
  <text x="332" y="188" font-size="11.5" fill="#1B2A30">· 알려진 회귀 패턴</text>
  <text x="332" y="216" font-size="10.5" fill="#5B6E74">목차 · cross-link · 검색으로 탐색</text>
  <text x="332" y="234" font-size="10.5" fill="#5B6E74">사람 감사(HITL audit) 가능</text>

  <!-- accumulation pipeline (right) -->
  <rect x="650" y="56" width="206" height="64" rx="8" fill="#F1F5F5" stroke="#5B6E74"/>
  <text x="753" y="82" font-size="13.5" font-weight="700" fill="#1B2A30" text-anchor="middle">운영 이벤트</text>
  <text x="753" y="102" font-size="11" fill="#5B6E74" text-anchor="middle">이슈 close · config 변경</text>
  <line x1="753" y1="120" x2="753" y2="144" stroke="#2FA98C" stroke-width="2" marker-end="url(#warrT)"/>

  <rect x="650" y="148" width="206" height="56" rx="8" fill="#E9F6F1" stroke="#2FA98C" stroke-width="1.5"/>
  <text x="753" y="171" font-size="12.5" font-weight="700" fill="#1B2A30" text-anchor="middle">① 증류 — 위키 문서 초안</text>
  <text x="753" y="190" font-size="10.5" fill="#5B6E74" text-anchor="middle">postmortem · 특이사항 · 패턴</text>
  <line x1="753" y1="204" x2="753" y2="228" stroke="#2FA98C" stroke-width="2" marker-end="url(#warrT)"/>

  <rect x="650" y="232" width="206" height="68" rx="8" fill="#F0EEFA" stroke="#7B6FD0" stroke-width="1.5"/>
  <text x="753" y="254" font-size="12.5" font-weight="700" fill="#7B6FD0" text-anchor="middle">② LLM-as-a-judge 검증</text>
  <text x="753" y="272" font-size="10.5" fill="#7B6FD0" text-anchor="middle">강화 tactic — QA-07 하네스 공유</text>
  <text x="753" y="290" font-size="10.5" fill="#5B6E74" text-anchor="middle">κ≥0.8 선검증 · 불합격 시 반려</text>
  <line x1="650" y1="262" x2="546" y2="200" stroke="#2FA98C" stroke-width="2" marker-end="url(#warrT)"/>
  <text x="604" y="216" font-size="11.5" fill="#2FA98C" text-anchor="middle">③ 등재(통과분만)</text>

  <!-- query arrows -->
  <line x1="204" y1="120" x2="312" y2="130" stroke="#2FA98C" stroke-width="2" marker-end="url(#warrT)"/>
  <circle cx="250" cy="106" r="10" fill="#2FA98C"/><text x="250" y="110" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="266" y="110" font-size="11.5" fill="#2FA98C">질의 (목차 · 검색)</text>
  <line x1="316" y1="196" x2="208" y2="186" stroke="#2FA98C" stroke-width="2" marker-end="url(#warrT)"/>
  <circle cx="252" cy="216" r="10" fill="#2FA98C"/><text x="252" y="220" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="268" y="220" font-size="11.5" fill="#2FA98C">문서 근거 반환</text>

  <!-- flywheel loop -->
  <path d="M114,236 C 150,336 660,344 843,126" fill="none" stroke="#5B6E74" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#warrG)"/>
  <text x="470" y="322" font-size="11.5" fill="#5B6E74" text-anchor="middle">⑥ 처리 결과가 새 이벤트로 — 선순환 ⟲ (축적 속도 = 이슈 처리량에 종속)</text>

  <!-- cold start: disconnected sources -->
  <rect x="24" y="380" width="170" height="64" rx="8" fill="none" stroke="#AEBCC0" stroke-dasharray="6 4"/>
  <text x="109" y="406" font-size="13" font-weight="700" fill="#8A9AA0" text-anchor="middle">Confluence</text>
  <text x="109" y="425" font-size="10.5" fill="#AEBCC0" text-anchor="middle">연결 없음</text>
  <rect x="214" y="380" width="170" height="64" rx="8" fill="none" stroke="#AEBCC0" stroke-dasharray="6 4"/>
  <text x="299" y="406" font-size="13" font-weight="700" fill="#8A9AA0" text-anchor="middle">Jira</text>
  <text x="299" y="425" font-size="10.5" fill="#AEBCC0" text-anchor="middle">연결 없음</text>
  <rect x="404" y="380" width="170" height="64" rx="8" fill="none" stroke="#AEBCC0" stroke-dasharray="6 4"/>
  <text x="489" y="406" font-size="13" font-weight="700" fill="#8A9AA0" text-anchor="middle">Messenger · 채팅</text>
  <text x="489" y="425" font-size="10.5" fill="#AEBCC0" text-anchor="middle">연결 없음</text>
  <line x1="290" y1="378" x2="348" y2="296" stroke="#C07A2D" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="300" y="346" font-size="16" font-weight="700" fill="#C07A2D">✕</text>
  <text x="600" y="404" font-size="13" font-weight="700" fill="#C07A2D">⚠ 기존 지식 공간과 연결 없음</text>
  <text x="600" y="424" font-size="11" fill="#5B6E74">콜드스타트: 시작 시점 위키 = 0 — 축적 전까지 조회할 지식이 없다</text>

  <text x="24" y="470" font-size="11.5" fill="#5B6E74">지식은 운영 루프에서만 생긴다 — judge를 통과한 문서만 등재된다</text>
</svg>
